    if(button.dataset.demo==='running'){threads['检查服务器存储'].running=true;return openChat('检查服务器存储');}
    if(button.dataset.demo==='error'){threads[current].running=false;threads[current].lines.push(['error','示例：读取服务状态时连接超时。请检查 SSH 连接后重试。','读取服务状态失败']);paintMessages();show('chat');messages.scrollTop=messages.scrollHeight;return;}
    if(button.dataset.demo==='approval')return modal('Andri 请求批准',['糖果熊机器人维护','请求审批模式 · 本次读取服务状态需要确认。'],[['拒绝',close],['批准这一次',close]],'systemctl status candybear.service');
    switch(button.dataset.action){
      case 'expand-composer':composerOpen=true;render();draft.focus();break;
      case 'collapse-composer':collapse();break;
      case 'compose-tools':{const tools=q('[data-compose-tools]');tools.hidden=!tools.hidden;button.setAttribute('aria-expanded',String(!tools.hidden));break;}
      case 'workspace':settings();break;
      case 'add-image':q('[data-compose-tools]').hidden=true;q('[data-image-picker]').click();break;
      case 'remove-image':selectedImage=null;delete attachments[current];render();break;
      case 'key':q('[data-key-label]').textContent='SSH 私钥已就绪';q('[data-key-detail]').textContent='点击更换私钥';q('[data-passphrase]').hidden=false;q('[data-action="connect"]').disabled=false;break;
      case 'connect':show('threads');break;
      case 'disconnect':show('connection');break;
      case 'back':drafts[current]=draft.value;show('threads');break;
      case 'new':threads['新对话']={model:state.model,effort:defaults.effort,running:false,...defaults,lines:[]};drafts['新对话']='';openChat('新对话');break;
      case 'menu':menu.hidden=!menu.hidden;break;
      case 'update':update();break;
      case 'refresh':menu.hidden=true;note.textContent='示例对话状态已刷新。';break;
      case 'history':button.textContent='已加载更早消息（演示）';break;
      case 'stop-collapsed':threads[current].running=false;render();break;
      case 'send':if(threads[current].running){threads[current].running=false;render();}else if(draft.value.trim()||selectedImage){const prompt=draft.value.trim()||'请查看这张图片。';threads[current].lines.push(['user',prompt,selectedImage]);renameNewThread(prompt);draft.value='';drafts[current]='';selectedImage=null;delete attachments[current];composerOpen=false;paintMessages();render();messages.scrollTop=messages.scrollHeight;}break;
    }
  });
  root.addEventListener('keydown',event=>{if(event.key==='Escape'){if(!overlay.hidden)close();else{menu.hidden=true;collapse();}}});
  overlay.addEventListener('keydown',event=>{if(event.key==='Tab'){const list=[...overlay.querySelectorAll('button,input')].filter(el=>!el.disabled&&!el.hidden),first=list[0],last=list[list.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
  function restore(saved){const value=saved?.privateContent;if(value?.revision===7||value?.revision===8){if(['connection','threads','chat'].includes(value.screen))state.screen=value.screen;state.query=typeof value.query==='string'?value.query:'';state.onlyRunning=value.onlyRunning===true;}q('[data-search]').value=state.query;render();}
  paintMessages();restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState)restore(event.detail.globals.widgetState);});
})();
</script>
